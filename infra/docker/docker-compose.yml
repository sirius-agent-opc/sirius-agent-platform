version: '3.8'

services:
  # Agent API 服务
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ../../:/app
    environment:
      - ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command: uvicorn platform.api.main:app --host 0.0.0.0 --port 8000 --reload

  # 开发数据库 (按需启用)
