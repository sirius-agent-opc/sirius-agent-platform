<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirius Agent — 在线体验</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'PingFang SC', sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        header { background: #1a1a2e; color: #fff; padding: 16px 24px; text-align: center; font-size: 1.1em; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 700px; margin: 0 auto; width: 100%; }
        .msg { margin: 12px 0; display: flex; }
        .user { justify-content: flex-end; }
        .bot { justify-content: flex-start; }
        .bubble { max-width: 80%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: .95em; }
        .user .bubble { background: #1a1a2e; color: #fff; border-bottom-right-radius: 4px; }
        .bot .bubble { background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        #input-area { border-top: 1px solid #ddd; padding: 16px; background: #fff; display: flex; gap: 8px; max-width: 700px; margin: 0 auto; width: 100%; }
        #input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; font-size: .95em; outline: none; }
        #input:focus { border-color: #1a1a2e; }
        #send { background: #1a1a2e; color: #fff; border: none; padding: 12px 24px; border-radius: 24px; cursor: pointer; font-size: .95em; }
        #send:hover { opacity: .9; }
        .typing .bubble { background: #e0e0e0; color: #999; }
        .info { text-align: center; color: #999; font-size: .85em; padding: 8px; }
    </style>
</head>
<body>
    <header>⚡ Sirius Agent · 在线体验</header>
    <div id="chat">
        <div class="msg bot"><div class="bubble">你好！我是 Sirius Agent。有什么可以帮你的？</div></div>
    </div>
    <div id="input-area">
        <input id="input" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') send()">
        <button id="send" onclick="send()">发送</button>
    </div>
    <script>
        const API = 'http://192.168.0.151:8000/chat';
        
        async function send() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            
            // 显示用户消息
            addMsg(text, 'user');
            
            // 显示加载
            const loadingId = addMsg('思考中...', 'bot', true);
            
            try {
                const resp = await fetch(API, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        messages: [{'role': 'user', 'content': text}],
                        model: 'deepseek-chat'
                    })
                });
                const data = await resp.json();
                document.getElementById(loadingId).remove();
                addMsg(data.reply, 'bot');
            } catch(e) {
                document.getElementById(loadingId).remove();
                addMsg('连接失败，请稍后重试。', 'bot');
            }
        }
        
        function addMsg(text, role, isLoading) {
            const chat = document.getElementById('chat');
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            if (isLoading) div.className += ' typing';
            div.id = id;
            div.innerHTML = '<div class="bubble">' + text.replace(/\n/g, '<br>') + '</div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
